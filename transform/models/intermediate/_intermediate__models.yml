version: 2

models:
  - name: int_player_gameweek_performance_unioned
    description: >
      Unions current-season live player-gameweek stats with 5 seasons of
      historical stats, both resolved to the stable player_code/team_code
      identifiers. Feeds fct_player_gameweek_performance directly.
    columns:
      - name: player_code
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: gameweek_id
        tests: [not_null]

  - name: int_player_recent_form
    description: >
      One row per player: recency-weighted per-90 rate stats blending
      current-season and up to 5 historical seasons (weight decays 0.55
      per season back). total_weight is a recency-weighted gameweek count
      used downstream as a confidence signal for shrinkage toward a
      positional baseline.
    columns:
      - name: player_code
        tests: [unique, not_null]

  - name: int_positional_baseline
    description: >
      Positional-average per-90 rates, weighted by each player's own
      sample size. Shrinkage target for low-sample players in
      int_player_form_shrunk.
    columns:
      - name: position_id
        tests: [unique, not_null]

  - name: int_player_form_shrunk
    description: >
      One row per current-squad player: int_player_recent_form shrunk
      toward int_positional_baseline by sample size, plus
      availability_factor from injury/suspension status. Shared input for
      any expected-points model regardless of which gameweek(s) it targets.
    columns:
      - name: player_code
        tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_code
