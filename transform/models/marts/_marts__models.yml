version: 2

models:
  - name: dim_players
    description: >
      Conformed player dimension across current + 5 historical seasons,
      keyed by the stable player_code. Players no longer in the Premier
      League have null current_price/form/status but still appear so
      historical facts have somewhere to join.
    columns:
      - name: player_code
        tests: [unique, not_null]

  - name: dim_teams
    description: >
      Conformed team dimension across current + 5 historical seasons,
      keyed by the stable team_code. Relegated/departed clubs have null
      strength ratings but still appear so historical facts have somewhere
      to join.
    columns:
      - name: team_code
        tests: [unique, not_null]

  - name: dim_positions
    description: GK/DEF/MID/FWD, stable across all seasons.
    columns:
      - name: position_id
        tests: [unique, not_null]

  - name: dim_gameweeks
    description: >
      One row per season+gameweek. Current season has full metadata
      (deadline, finished flag); historical seasons only have the gameweek
      number.
    columns:
      - name: season
        tests: [not_null]
      - name: gameweek_id
        tests: [not_null]

  - name: fct_player_gameweek_performance
    description: >
      Grain: player x season x gameweek. Actual points and underlying stats,
      current season (live, fills in as gameweeks are played) unioned with
      5 historical seasons (training data).
    columns:
      - name: player_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_code
      - name: season
        tests: [not_null]
      - name: gameweek_id
        tests: [not_null]

  - name: fct_fixtures
    description: "Grain: fixture x season. Current season only."
    columns:
      - name: fixture_id
        tests: [unique, not_null]
      - name: home_team_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_code
      - name: away_team_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_code

  - name: fct_entry_gameweek_performance
    description: >
      Grain: manager (entry) x gameweek. Points, rank, bank, team value,
      transfers made/cost, active chip. Populates once the season starts.
    columns:
      - name: entry_id
        tests: [not_null]
      - name: gameweek_id
        tests: [not_null]

  - name: fct_entry_picks
    description: >
      Grain: manager x gameweek x player. Squad composition, captain/vice
      flags. Populates once each gameweek's deadline passes.
    columns:
      - name: player_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_code

  - name: fct_entry_transfers
    description: "Grain: one row per transfer made (player in/out, cost, time)."

  - name: fct_player_expected_points
    description: >
      Grain: one row per current-squad player, predicting points for the
      NEXT unplayed gameweek (dim_gameweeks.is_next). Statistical formula
      (not ML): int_player_recent_form's rates, shrunk toward a positional
      baseline by sample size, scaled by expected minutes and a
      fixture-difficulty multiplier from dim_teams strength ratings.
      fixture_count is 0 for a blank gameweek, 2+ for a double gameweek
      (points summed across all fixtures that week). See the model's
      top-of-file comment for known v1 simplifications.
    columns:
      - name: player_code
        tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_code

  - name: fct_team_gameweek_fixtures
    description: >
      Grain: team x gameweek (current season). Flags blank
      (fixture_count = 0) and double (fixture_count >= 2) gameweeks per
      team -- the signal chip timing (bench boost, triple captain, free
      hit) actually depends on. Currently every gameweek has exactly one
      fixture per team; DGWs/BGWs only appear once fixtures are actually
      rearranged mid-season and this is rebuilt.
    columns:
      - name: team_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_code
      - name: gameweek_id
        tests: [not_null]

  - name: fct_player_expected_points_by_gameweek
    description: >
      Grain: player x gameweek, for the next 8 (default prediction_horizon_gameweeks)
      gameweeks. Same formula as fct_player_expected_points, repeated per
      gameweek in the horizon with that gameweek's specific opponent(s).
      Feeds fct_player_expected_points_horizon; not intended for
      single-week decisions.
    columns:
      - name: player_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_code

  - name: fct_player_expected_points_horizon
    description: >
      Grain: one row per current-squad player. Discounted (0.95 per week
      further out) sum of fct_player_expected_points_by_gameweek across
      the prediction horizon -- used for season-aware initial squad
      selection so a player isn't picked purely on one week's fixture.
      Not for week-to-week decisions (captaincy, transfers) -- use
      fct_player_expected_points for those.
    columns:
      - name: player_code
        tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_code
