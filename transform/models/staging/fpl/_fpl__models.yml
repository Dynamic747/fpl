version: 2

models:
  - name: stg_fpl__gameweeks
    description: One row per gameweek (event), from the latest bootstrap-static snapshot.
    columns:
      - name: gameweek_id
        tests: [unique, not_null]

  - name: stg_fpl__positions
    description: Player positions (GK/DEF/MID/FWD), from the latest bootstrap-static snapshot.
    columns:
      - name: position_id
        tests: [unique, not_null]

  - name: stg_fpl__teams
    description: Premier League teams, from the latest bootstrap-static snapshot.
    columns:
      - name: team_id
        tests: [unique, not_null]

  - name: stg_fpl__players
    description: Current player attributes (price, form, status), from the latest bootstrap-static snapshot.
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: team_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_fpl__teams')
                field: team_id
      - name: position_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_fpl__positions')
                field: position_id

  - name: stg_fpl__fixtures
    description: Full season fixture list, from the latest fixtures snapshot.
    columns:
      - name: fixture_id
        tests: [unique, not_null]

  - name: stg_fpl__player_gameweek_history
    description: Per-player, per-gameweek actual stats for gameweeks played so far this season.
    columns:
      - name: player_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_fpl__players')
                field: player_id

  - name: stg_fpl__entries
    description: Manager (entry) profile, from the latest entry snapshot.
    columns:
      - name: entry_id
        tests: [unique, not_null]

  - name: stg_fpl__entry_season_history
    description: Manager's season-by-season summary from past seasons.

  - name: stg_fpl__entry_gameweek_history
    description: >
      Manager's this-season gameweek-by-gameweek history: points, rank,
      bank, team value, transfers made and their cost, points left on bench.
      Populates once the season starts.

  - name: stg_fpl__entry_chips
    description: >
      Which chips (wildcard, bench boost, triple captain, free hit) the
      manager has played and on which gameweek. Populates as chips are used.

  - name: stg_fpl__entry_picks
    description: Manager's squad picks (one row per player) for a given gameweek (only populated once the API exposes them).

  - name: stg_fpl__entry_picks_summary
    description: >
      One row per manager per gameweek: bank, team value, transfers made/cost,
      active chip, and points for that gameweek. Companion to stg_fpl__entry_picks
      (which is one row per player pick) — only populated once the API exposes picks.

  - name: stg_fpl__entry_transfers
    description: Manager's transfer log — one row per transfer made (player in/out, cost, time).

  - name: stg_fpl__historical_players
    description: >
      One row per player per past season, from the vaastav GitHub archive.
      season_player_id and season_team_id are only valid within that season;
      player_code is stable across seasons and is the join key for
      cross-season player identity.

  - name: stg_fpl__historical_player_gameweek_stats
    description: >
      One row per player per gameweek per past season, from the vaastav GitHub
      archive. This is the training-data source the live pipeline can't provide
      until this season's gameweeks are actually played.
