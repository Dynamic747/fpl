version: 2

sources:
  - name: fpl_raw
    schema: raw
    description: >
      Append-only JSONB snapshots landed by scripts/ingest_raw.py, one row
      per ingestion run. Staging models always select the latest snapshot.
    tables:
      - name: bootstrap_static_snapshot
        description: Full bootstrap-static payload (teams, players, gameweeks, positions).
      - name: fixtures_snapshot
        description: Full season fixture list.
      - name: element_summary_snapshot
        description: Per-player gameweek history, keyed by element_id.
      - name: entry_snapshot
        description: Manager (entry) profile snapshot.
      - name: entry_history_snapshot
        description: Manager's past-seasons summary and chip usage.
      - name: entry_picks_snapshot
        description: Manager's squad picks for a given gameweek.
      - name: entry_transfers_snapshot
        description: Manager's transfer log (player in/out, cost, timestamp).
      - name: historical_gw_stats_snapshot
        description: >
          Bulk-loaded from vaastav/Fantasy-Premier-League on GitHub: one row per
          season, payload is that season's full player-gameweek stats CSV as JSON.
      - name: historical_players_snapshot
        description: >
          Bulk-loaded from vaastav/Fantasy-Premier-League on GitHub: one row per
          season, payload is that season's player list CSV as JSON (includes the
          cross-season-stable `code` field and set-piece order fields).
      - name: historical_teams_snapshot
        description: >
          Bulk-loaded from vaastav/Fantasy-Premier-League on GitHub: one row per
          season, payload is that season's team list CSV as JSON (includes the
          cross-season-stable `code` field).
